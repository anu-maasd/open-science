name: Windows Package Budget Validation
on:
  push:
    branches: [ci/windows-package-budget-validation]
    paths: [.github/workflows/windows-package-budget-validation.yml]
permissions:
  contents: read
jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Verify all five journeys three times with finite budgets
        shell: pwsh
        run: |
          for ($iteration = 1; $iteration -le 3; $iteration++) {
            npm test -- src/main/session-package/fork.test.ts src/main/session-package/literature.test.ts src/main/session-package/service.test.ts -t 'preserves omitted-file evidence through an imported fork|round-trips Reading PDF metadata|exports shared .* PDF notes only by opt-in' --silent=false --maxWorkers=1 --testTimeout=60000 --hookTimeout=60000 --reporter=default --reporter=json "--outputFile=test-results/package-budget-$iteration.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload repeat evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-budget-validation
          path: test-results/package-budget-*.json
          retention-days: 7
          if-no-files-found: error
