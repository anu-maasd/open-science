name: Windows Package Timing Diagnostics
on:
  push:
    branches: [ci/windows-package-diagnostics]
    paths: [.github/workflows/windows-package-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Add test-owned timing observations
        run: node scripts/ci/package-timing-diagnostics.mjs
      - name: Reproduce package timeouts at original budgets
        run: >-
          npm test --
          src/main/session-package/fork.test.ts
          src/main/session-package/literature.test.ts
          src/main/session-package/service.test.ts
          -t "preserves omitted-file evidence through an imported fork|round-trips Reading PDF metadata|exports shared .* PDF notes only by opt-in"
          --maxWorkers=1 --testTimeout=60000 --hookTimeout=60000
          --reporter=default --reporter=json --outputFile=test-results/package-timing.json
      - name: Upload timing evidence and instrumented tests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-timing-diagnostics
          path: |
            test-results/package-timing.json
            src/main/session-package/fork.test.ts
            src/main/session-package/literature.test.ts
            src/main/session-package/service.test.ts
            src/main/artifacts/provenance-test-fixtures.ts
          retention-days: 7
