name: Source Head Validation

on:
  push:
    branches: [ci/source-head-validation]
    paths: [.github/workflows/source-head-validation.yml]

permissions:
  actions: read
  contents: read

jobs:
  regression:
    name: Complete source regression (macOS)
    if: github.ref == 'refs/heads/ci/source-head-validation'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Build Electron application
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'presentation-screening' }}
        run: npm run build:e2e
      - name: Build web application
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
        run: npm run build:web
      - name: Install headless Chromium
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'presentation' || inputs.mode == 'presentation-screening' }}
        run: npx playwright install chromium --only-shell
      - name: Run complete Mac functional journeys
        id: functional
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/functional
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/functional.json
        # Leave headroom for slower macOS runners to finish every journey and teardown.
        run: npm run test:e2e:journey -- --fail-on-flaky-tests --global-timeout=900000
      # Later Electron suites reuse and clean this directory. Preserve the first failure now.
      - name: Preserve functional failure diagnostics
        if: ${{ always() && steps.functional.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-regression-functional-${{ github.run_attempt }}
          retention-days: 5
          path: |
            blob-report/functional/
            test-results/electron/
            test-results/functional.json
            playwright-report/
          if-no-files-found: warn
      - name: Run complete Mac workspace journeys
        id: workspace
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
        continue-on-error: true
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/workspace
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/workspace.json
        run: npm run test:e2e:workspace -- --fail-on-flaky-tests --global-timeout=1500000
      - name: Test workspace message images
        id: workspace_images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'workspace-images' }}
        run: >-
          npx playwright test e2e/workspace-files.spec.ts
          --grep 'normalizes OpenCode inline thinking before publishing sanitized message images'
          --fail-on-flaky-tests
      - name: Run complete Mac browser and visual coverage
        id: presentation
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'presentation' }}
        continue-on-error: true
        run: |
          # All 462 browser tests passed before the 10-minute budget expired in
          # teardown. Keep visual's separate budget and collect both outcomes.
          browser_status=0
          npx playwright test --config e2e/playwright.browser.config.ts --fail-on-flaky-tests --global-timeout=900000 || browser_status=$?
          npm run test:e2e:visual -- --fail-on-flaky-tests --global-timeout=600000
          exit "$browser_status"
      - name: Test concurrent screening flights
        id: presentation_screening
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'presentation-screening' }}
        run: >-
          npx playwright test --config e2e/playwright.browser.config.ts
          e2e/browser/smart-screening.spec.ts
          --grep 'flies all four committed papers per second concurrently into the same pile'
          --repeat-each=5
          --fail-on-flaky-tests
      - name: Run complete Mac accessibility checks
        id: accessibility
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'presentation' }}
        continue-on-error: true
        run: npm run test:e2e:accessibility:signal
      # Collect both outcomes using one build and one macOS slot. Neither failure is advisory.
      - name: Run supplemental regressions
        id: regressions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
        continue-on-error: true
        uses: ./.github/actions/source-regression
        with:
          group: regressions
          include-capacity: 'true'
      - name: Run supplemental delegation
        id: delegation
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
        continue-on-error: true
        uses: ./.github/actions/source-regression
        with:
          group: delegation
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-regression-${{ github.run_attempt }}
          retention-days: 5
          path: |
            blob-report/
            test-results/
            playwright-report/
          if-no-files-found: warn
      - name: Enforce complete Mac core and presentation suites
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'full') }}
        shell: bash
        env:
          FUNCTIONAL: ${{ steps.functional.outcome }}
          WORKSPACE: ${{ steps.workspace.outcome }}
          PRESENTATION: ${{ steps.presentation.outcome }}
          ACCESSIBILITY: ${{ steps.accessibility.outcome }}
        run: |
          [[ "$FUNCTIONAL" == "success" && "$WORKSPACE" == "success" && "$PRESENTATION" == "success" && "$ACCESSIBILITY" == "success" ]]
      - name: Enforce both supplemental suites
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'full') }}
        shell: bash
        env:
          REGRESSIONS: ${{ steps.regressions.outcome }}
          DELEGATION: ${{ steps.delegation.outcome }}
        run: |
          [[ "$REGRESSIONS" == "success" && "$DELEGATION" == "success" ]]
      - name: Enforce presentation dry-run
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'presentation' }}
        shell: bash
        env:
          PRESENTATION: ${{ steps.presentation.outcome }}
          ACCESSIBILITY: ${{ steps.accessibility.outcome }}
        run: '[[ "$PRESENTATION" == "success" && "$ACCESSIBILITY" == "success" ]]'
      - name: Enforce workspace image dry-run
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'workspace-images' }}
        shell: bash
        env:
          WORKSPACE_IMAGES: ${{ steps.workspace_images.outcome }}
        run: '[[ "$WORKSPACE_IMAGES" == "success" ]]'
      - name: Enforce screening flight dry-run
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'presentation-screening' }}
        shell: bash
        env:
          PRESENTATION_SCREENING: ${{ steps.presentation_screening.outcome }}
        run: '[[ "$PRESENTATION_SCREENING" == "success" ]]'

  # Scheduled failures open or refresh one tracking issue; a later scheduled success closes it.